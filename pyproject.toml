[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tissu-cli"
version = "1.0.0"
description = "A command line interface for Tissu"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Evan Miranda" }]
keywords = ["cloth", "simulation", "tissu", "cli"]

dependencies = [    
    "pytissu",
    "typer",
    "rich",
    "tqdm",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/evanrock520-ciencias/tissu-cli"
Repository = "https://github.com/evanrock520-ciencias/tissu-cli.git"
Issues = "https://github.com/evanrock520-ciencias/tissu-cli/issues"

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
tissu-cli = "tissu_cli.main:app"